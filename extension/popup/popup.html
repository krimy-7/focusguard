<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        </svg>
      </div>
      <div class="brand-text">
        <h1>FocusGuard</h1>
        <span class="brand-badge">PRO</span>
      </div>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
  </header>

  <section class="context-card" id="contextCard">
    <div class="card-header-row">
      <p class="eyebrow">Active Context</p>
    </div>
    
    <div id="contextActive" hidden>
      <div class="context-title-row">
        <h2 id="contextTitle">—</h2>
        <span class="state-pill" id="contextStatePill">Active</span>
      </div>
      <p class="status-line" id="contextMeta"></p>
      <div class="context-actions" id="contextActions" hidden>
        <button class="action-btn primary-btn" id="backToWorkBtn">
          <span class="action-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
          </span>
          <span id="backToWorkLabel">Back to work</span>
        </button>
        <div class="propose-actions" id="interventionExtra">
          <button class="action-btn small ghost" id="seeProgressBtn">See progress</button>
          <button class="action-btn small ghost" id="takeBreakBtn">Take a break</button>
          <button class="action-btn small ghost" id="extendBtn">Extend</button>
        </div>
      </div>
    </div>

    <div id="contextPropose" hidden>
      <p class="propose-note" id="proposeNote">Detected: —</p>
      <input class="propose-input" id="proposeTitle" type="text" maxlength="120" placeholder="What are you working on?" />
      <div class="propose-actions">
        <button class="action-btn small ghost" id="proposeCancelBtn">Cancel</button>
        <button class="action-btn small confirm" id="proposeOkBtn">Confirm Target</button>
      </div>
    </div>
  </section>

  <section class="focus-card" id="focusCard" style="display: none;">
    <div class="focus-accent"></div>
    <div class="focus-top">
      <div>
        <p class="eyebrow" style="display: none;">On this tab</p>
        <h2 id="currentFocus" style="display: none;">Detecting…</h2>
      </div>
      <div class="timer-pulse">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.59L8.71 12.3a1 1 0 1 1 1.41-1.41L12 12.59l4.88-4.88a1 1 0 0 1 1.41 1.41z" />
        </svg>
      </div>
    </div>
    <div class="timer-row">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
      <div class="timer-labels">
        <span id="elapsedLabel">00:00</span>
        <span id="goalLabel" class="goal-label">25:00 goal</span>
      </div>
    </div>
    <button class="pause-btn" id="pauseBtn" title="Pause / Resume focus">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="#ffffff">
        <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
      </svg>
    </button>
  </section>

  <section class="actions">
    <button class="action-btn secondary-action" id="logInterrupt">
      <span class="action-icon alert-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </span>
      <span class="btn-label">Log Interruption</span>
      <span class="chevron">›</span>
    </button>
    <button class="action-btn teal" id="quickBreak">
      <span class="action-icon break-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
      </span>
      <span class="btn-label">Quick Break (5m)</span>
      <span class="chevron">⚡</span>
    </button>
  </section>

  <section class="stats-section">
    <div class="section-title-row">
      <h3>Stats at a Glance</h3>
      <span class="today-tag">Today</span>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon mint">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </div>
        <div class="stat-details">
          <p class="stat-label">Focus Time</p>
          <p class="stat-value" id="focusTime">0m</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon coral">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
        </div>
        <div class="stat-details">
          <p class="stat-label">Interrupts</p>
          <p class="stat-value" id="interrupts">0</p>
        </div>
      </div>
    </div>
  </section>

  <section class="insight" id="insightCard" hidden>
    <div class="insight-header">
      <span class="insight-spark">✨</span>
      <span class="insight-title">AI Focus Nudge</span>
    </div>
    <p class="insight-text" id="insightText"></p>
    <p class="insight-suggestion" id="insightSuggestion"></p>
  </section>

  <footer class="footer">
    <a id="dashboardLink" href="#" target="_blank">
      <span>Dashboard</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        <polyline points="15 3 21 3 21 9" />
        <line x1="10" y1="14" x2="21" y2="3" />
      </svg>
    </a>
    <div class="mascot-pill" title="FocusGuard Companion">
      <div class="mascot-orb">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="#0f766e">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        </svg>
      </div>
      <span id="mascotHint">Stay focused & hydrated!</span>
    </div>
  </footer>
  <button class="reset-btn" id="resetBtn" title="Wipe the backend database and re-seed fresh data">Reset local data</button>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
