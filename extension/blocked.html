<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>This can wait · FocusGuard AI</title>
  <style>
    /* Contrast: text 16.7:1, muted 10.5:1, button text 12.8:1. Motion: opacity only. */
    :root { --bg: #12100f; --fg: #f5f0e8; --muted: #c9bfb2; --accent: #5eead4; --line: #3a3532; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 440px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    h1 { font-size: 28px; line-height: 1.2; }
    p { color: var(--muted); }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    button { min-height: 48px; padding: 12px 16px; border-radius: 12px; font-weight: 700; font-size: 15px; font-family: inherit; cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: var(--fg); transition: opacity 0.2s ease; }
    button.primary { background: var(--accent); color: var(--bg); border-color: transparent; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #wait { font-size: 14px; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Beast Mode</p>
    <h1 id="headline"><span id="site">This site</span> can wait.</h1>
    <p id="why">You asked FocusGuard AI to keep it closed for a while. It'll still be here later.</p>
    <div class="actions">
      <button class="primary" id="back" type="button">Back to <span id="ctx">what you were doing</span></button>
      <button id="cont" type="button" disabled aria-describedby="wait">Continue anyway</button>
    </div>
    <p id="wait" aria-live="polite">Continue anyway is available in 10 seconds.</p>
  </main>
  <script type="module" src="beast/blocked.js"></script>
</body>
</html>
