<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>This can wait · FocusGuard AI</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <style>
    /* Always the warm-dark sal-wood palette (data-theme="dark"): this page is shown mid-distraction, often late.
       Contrast: text on ground 13:1, secondary 8:1, Back (dark on moss) 7:1. Motion: none beyond the buttons' colour. */
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .head { height: 72px; padding: 0 24px; }
    main { flex: 1; width: 100%; max-width: 460px; margin: 0 auto; padding: 48px 24px 64px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
    .win--hero { margin-bottom: 8px; }
    h1 { font-size: 28px; line-height: 1.2; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
    main p { color: var(--ink-2); max-width: 44ch; text-wrap: pretty; }
    .actions { display: grid; gap: 12px; width: 100%; margin-top: 8px; }
    #wait { min-height: 1.45em; }
  </style>
</head>
<body>
  <header class="brick head">
    <span class="win win--mark" data-state="open" aria-hidden="true"><span class="win__leaf"></span><span class="win__pane"><span class="yeti"></span></span></span>
    <p class="name">FocusGuard AI</p>
  </header>
  <main>
    <span class="win win--hero" data-state="wait" aria-hidden="true"><span class="win__leaf"></span><span class="win__pane"><span class="yeti"></span></span></span>
    <h1 id="headline"><span id="site">This site</span> can wait.</h1>
    <p id="why">You asked FocusGuard AI to keep it closed for a while. It’ll still be here later.</p>
    <div class="actions">
      <button class="btn back" id="back" type="button"><span>Back to <span id="ctx">what you were doing</span></span></button>
      <button class="btn" id="cont" type="button" disabled aria-describedby="wait">Open for 10 min</button>
    </div>
    <p id="wait">Open for 10 min is available in 10 seconds.</p>
    <!-- Announced twice in total (start, ready), not every second -->
    <p class="sr-only" id="announce" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="beast/blocked.js"></script>
</body>
</html>
